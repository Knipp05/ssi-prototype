services:
  frontend:
    build:
      dockerfile: ./client/Dockerfile
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - frontend_data:/app/data

  backend:
    build:
      dockerfile: Dockerfile
      context: ./server
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - backend_data:/app/data

  vdr:
    build:
      dockerfile: Dockerfile
      context: ./vdr
    ports:
      - "3002:3002"
    env_file:
      - .env
    volumes:
      - vdr_data:/app/data

volumes:
  frontend_data:
  backend_data:
  vdr_data:
